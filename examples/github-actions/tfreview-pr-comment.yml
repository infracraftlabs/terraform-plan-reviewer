# Example: review a Terraform plan on every pull request and keep one comment up to date.
#
# Why this shape: `terraform show -json` output can contain secrets in plain text (Terraform documents
# this for sensitive values), and a plan file committed to a pull request can be edited by its author.
# So the plan is produced and reviewed inside ONE trusted job and never leaves that runner: it is not
# committed, not uploaded and deleted after the review. Only review.md crosses to the next job; it is the
# same redacted text that becomes the public pull-request comment.
#
# Jobs and permissions:
# - plan-and-review: contents: read, plus id-token: write only for your cloud's OIDC login (not shown).
#   Runs only for pull requests from this repository, never from forks.
# - comment: pull-requests: write and nothing else. It never sees the plan.
#
# Model: GitHub-hosted runners have no local model, so this runs tfreview in rules-only mode
# (deterministic rules, no AI). For AI mode, use a self-hosted runner with Ollama and the model pulled;
# nothing is sent to a hosted model.
#
# Status: checked with actionlint. Not yet run end to end on GitHub against a real cloud account.
#
# Actions are pinned to full commit SHAs (the comment names the release). Review a SHA before you
# update it.

name: terraform-plan-review

on:
  pull_request:
    paths:
      - "infra/**"

permissions: {}

jobs:
  plan-and-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # only for your cloud's OIDC login; remove it if you authenticate another way
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Your cloud login goes here (for example the provider's official OIDC action). Not part of this example.

      - name: Install tfreview (pinned to a reviewed commit)
        run: pip install "tfreview @ git+https://github.com/infracraftlabs/terraform-plan-reviewer@d3d6eac081b36131767e0da5da428fbca699e3e2"

      - name: Plan and review (the plan never leaves this runner)
        run: |
          plan_dir="$(mktemp -d "$RUNNER_TEMP/plan.XXXXXX")"
          trap 'rm -rf "$plan_dir"' EXIT
          terraform init -input=false
          terraform plan -input=false -out "$plan_dir/plan.out"
          terraform show -json "$plan_dir/plan.out" > "$plan_dir/plan.json"
          tfreview "$plan_dir/plan.json" --rules-only --output "$RUNNER_TEMP/review.md"
          cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfreview
          path: ${{ runner.temp }}/review.md
          retention-days: 1

  comment:
    needs: plan-and-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfreview

      - name: Update the review comment (one comment per pull request)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # --edit-last edits the last comment made with this token. If other workflows also comment with
        # the default token, give this job its own comment marker or app token instead.
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body-file review.md
